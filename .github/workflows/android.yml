name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Export Story JSON
        run: npm run export:story

      - name: Prepare Android Assets
        run: |
          mkdir -p android-native/app/src/main/assets
          cp export/story.json android-native/app/src/main/assets/story.json

      - name: Grant execute permission for gradlew
        run: chmod +x android-native/gradlew

      - name: Build with Gradle
        run: |
          cd android-native
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
