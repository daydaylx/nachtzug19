name: Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ts-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test -- run

      - name: Validate story graph
        run: npm run validate

      - name: Export story JSON
        run: npm run export:story

  android-runtime:
    runs-on: ubuntu-latest
    needs: ts-content
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Export story JSON
        run: npm run export:story

      - name: Refresh golden-master traces
        run: npx tsx scripts/generate_test_trace.ts

      - name: Run Android unit tests
        run: |
          cd android-native
          ./gradlew testDebugUnitTest
